name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Verify Alembic migrations match models
        env:
          DATABASE_URL: "sqlite:///./data/ci-alembic-check.db"
        run: |
          alembic upgrade head
          alembic check
          rm -f ./data/ci-alembic-check.db

      - name: Run pytest with coverage
        # No OpenAI key is set and none of these tests reach the network —
        # the LLM abstraction is always mocked/stubbed (see backend/tests/fakes.py).
        run: pytest

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

  e2e:
    name: Full-stack E2E
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies into a virtualenv
        working-directory: backend
        # A venv at backend/.venv matches local development exactly —
        # frontend/playwright.config.ts always launches the backend
        # webServer via backend/.venv/bin/python3, never a bare `python3`
        # on PATH, so this same layout must exist here too.
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: frontend
        # Test-only environment (APP_ENV=test, E2E_FAKE_AI=true), the
        # isolated SQLite database, and the Alembic migration step are all
        # configured centrally in playwright.config.ts's webServer entries
        # — no OpenAI key, no network provider calls, no developer database.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
